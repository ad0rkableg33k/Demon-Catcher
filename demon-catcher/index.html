<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Amulet: Demon Catcher Activity</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="game-header">
            <h1><span class="magenta-glow">⛧</span> VOID AMULET <span class="magenta-glow">⛧</span></h1>
            <nav class="game-nav">
                <button id="nav-explore" class="active">Wander the Abyss</button>
                <button id="nav-collection">Demonic Pact (Collection)</button>
            </nav>
        </header>

        <main id="view-explore" class="view active">
            <div class="encounter-zone">
                <div id="wild-demon-container" class="hidden">
                    <h2 id="wild-demon-name" class="demon-name"></h2>
                    <p class="demon-class" id="wild-demon-class"></p>
                    <img id="wild-demon-image" src="" alt="Wild Demon">
                    <div class="action-bar">
                        <button id="btn-throw-amulet" class="action-btn">Throw Soul Amulet</button>
                        <button id="btn-flee" class="action-btn secondary">Flee</button>
                    </div>
                    <p id="encounter-log"></p>
                </div>
                <div id="explore-prompt">
                    <p>The shadows writhe. What lurks beyond?</p>
                    <button id="btn-explore" class="action-btn massive-btn">Search for Demons</button>
                    <p id="discord-status" class="status-text"></p>
                </div>
            </div>
        </main>

        <main id="view-collection" class="view">
            <h2>Bound Entities</h2>
            <div id="collection-grid" class="grid">
                <!-- Bound demons injected here via JS -->
            </div>
            <div id="empty-collection" class="hidden">
                <p>Your amulet is empty. You have bound no demons yet.</p>
            </div>
        </main>
    </div>

    <!-- Script loaded as a module to support ES6 imports for the Discord SDK -->
    <script type="module" src="app.js"></script>
</body>
</html>
